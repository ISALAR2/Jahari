<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Jahari 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --rose-main: #ff4d6d;
            --rose-soft: #ffb3c1;
            --bg-gradient: linear-gradient(135deg, #1a080d 0%, #3d0a14 50%, #590d22 100%);
            --glass: rgba(20, 20, 20, 0.75);
            --text-light: #fff0f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            color: var(--text-light);
            overflow-x: hidden;
        }

        .main-card {
            width: 100%;
            max-width: 650px;
            background: rgba(30, 10, 15, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 45px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 77, 109, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--rose-main);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.15rem;
            font-weight: 300;
            color: #ffccd5;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        /* Proposal Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            min-height: 70px;
        }

        .btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.25);
        }

        .btn-yes {
            background: var(--rose-main);
            color: #fff;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            background: #e63956;
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.1);
            color: var(--rose-soft);
            border: 2px solid rgba(255, 77, 109, 0.3);
        }

        /* Unlocked Content */
        #unlocked-content {
            display: none;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            text-align: center;
        }

        /* Language Switcher */
        .lang-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: rgba(255, 77, 109, 0.15);
            border: 1px solid var(--rose-main);
            color: #ffccd5;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--rose-main);
            color: #fff;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0 30px 0;
        }

        .photo-card {
            width: 100%;
            height: 240px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 3px solid var(--rose-main);
            background: #111;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Music Banner */
        .music-banner {
            background: rgba(255, 77, 109, 0.15);
            border: 1px solid var(--rose-main);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .music-info {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffccd5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-btn {
            background: var(--rose-main);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Letter Styling */
        .letter-card {
            background: rgba(45, 12, 20, 0.9);
            padding: 35px 30px;
            border-radius: 24px;
            text-align: left;
            line-height: 1.9;
            font-size: 1.05rem;
            color: #ffccd5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-left: 5px solid var(--rose-main);
            white-space: pre-line;
            margin-bottom: 25px;
        }

        .letter-card.rtl {
            text-align: right;
            direction: rtl;
            border-left: none;
            border-right: 5px solid var(--rose-main);
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--rose-main);
            text-align: center;
            margin-bottom: 15px;
        }

        .signature {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            text-align: right;
            color: var(--rose-main);
            margin-top: 15px;
        }

        .signature.rtl {
            text-align: left;
        }

        .heart-particle {
            position: fixed;
            color: rgba(255, 77, 109, 0.3);
            font-size: 22px;
            pointer-events: none;
            animation: floatUp 7s infinite linear;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 500px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
            .photo-card {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <script>
        for (let i = 0; i < 18; i++) {
            let heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(heart);
        }
    </script>

    <div class="main-card">
        <div id="proposal-view">
            <h1>Jahari 💕</h1>
            <p class="subtitle">
                Cinco años enteros de historia, risas y complicidad.<br>
                Hoy toca hacerlo oficial.
            </p>

            <h2 style="color: var(--rose-main); font-size: 1.8rem; font-weight: 600; margin: 20px 0;">
                ¿Quieres ser mi novia?
            </h2>

            <div class="btn-container">
                <button class="btn btn-yes" onclick="acceptProposal()">¡SÍ! ❤️</button>
                <button class="btn btn-no" id="no-btn" onmouseover="dodgeNo()" onclick="dodgeNo()">No 💔</button>
            </div>
        </div>

        <div id="unlocked-content">
            <!-- Music Player -->
            <div class="music-banner">
                <div class="music-info">
                    🎵 <span>Lil Durk ft. NBA YoungBoy - My Side</span>
                </div>
                <button class="music-btn" id="audio-toggle" onclick="toggleMusic()">Pausar</button>
            </div>

            <!-- Language Switcher -->
            <div class="lang-container">
                <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">English 🇺🇸</button>
                <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">Español 🇲🇽</button>
                <button class="lang-btn" id="btn-ar" onclick="setLanguage('ar')">العربية 🇸🇦</button>
            </div>

            <h2 class="letter-title" id="letter-title">Para Jahari</h2>

            <div class="photo-grid">
                <div class="photo-card">
                    <img src="517d66e4-75f0-42d1-9dee-e0bb692a44c7.jpg" alt="Foto 1">
                </div>
                <div class="photo-card">
                    <img src="a9b59fc7-8c0c-4142-ae24-84502574274b.jpg" alt="Foto 2">
                </div>
            </div>

            <div class="letter-card" id="letter-body">
                <!-- Text inserted dynamically via JS -->
            </div>
        </div>
    </div>

    <!-- Audio Source -->
    <audio id="bg-music" loop preload="auto">
        <source src="Lil Durk ft.NBA YoungBoy - My Side (Official Audio).mp3" type="audio/mpeg">
    </audio>

    <script>
        const translations = {
            en: {
                title: "For Jahari",
                body: `Jahari,

I remember one night when I was feeling really lonely, and I downloaded that stupid app—basically Tinder for gamers. I ran into this one beautiful girl by the username tapstrafeintomydms. I know, crazy name!

I remember your punchline asking how many donuts you could stack on it, and my answer was "2 on my finger." I honestly don't know what made you answer me that night—I'm sure you had so many candidates in your DMs knowing how super pretty you are. But I am so glad you did, because that was the true beginning of our story... our beautiful 5-year story, babe.

We endured and suffered a lot together over the years, through tough times and heartbreak. But alongside those dark moments came times that were so fun and so warm. We spent countless sleepless nights playing Apex. That's what made us fall in love first, and it still holds a special place in my heart, even if it's a shitty game sometimes. Then we found Fortnite, Call of Duty, and so many others.

Somewhere in all of that, I started realizing that you are my home. Even in my darkest times, you were my comfort—the one who made me feel safe and secure. 

I know we're getting married in the upcoming weeks or months, but before we do that, I realized I skipped an important step. I totally forgot to officially ask you to be my girlfriend! But it's okay, because asking you right now is the best way to start this next chapter.

I love you lots, baby. ❤️`,
                sig: "Forever yours ❤️"
            },
            es: {
                title: "Para Jahari",
                body: `Jahari,

Recuerdo una noche en la que me sentía muy solo y descargué esa app—básicamente Tinder para gamers. Y me topé con una chica hermosa con el nombre de usuario tapstrafeintomydms. ¡Sé que es un nombre loco!

Recuerdo que tu pregunta fue cuántas donas se podían apilar, y mi respuesta fue "2 en mi dedo". Sinceramente no sé qué te hizo responderem esa noche; estoy seguro de que tenías muchísimos candidatos en tus DMs sabiendo lo hermosa que eres. Pero me alegro tanto de que lo hicieras, porque ese fue el verdadero comienzo de nuestra historia... nuestra hermosa historia de 5 años, mi amor.

Soportamos y atravesamos mucho juntos a lo largo de los años, con momentos difíciles. Pero junto a esos días oscuros vinieron momentos llenos de risas y calidez. Pasamos incontables noches sin dormir jugando Apex. Eso fue lo que nos hizo enamorarnos primero, y todavía tiene un lugar especial en mi corazón, aunque a veces sea un juego malo. Luego encontramos Fortnite, Call of Duty y muchos otros.

En algún punto de todo eso, me di cuenta de que tú eres mi hogar. Incluso en mis momentos más oscuros, fuiste mi consuelo, quien me hizo sentir seguro y en paz.

Sé que nos vamos a casar en las próximas semanas o meses, pero antes de hacer eso, me di cuenta de que me salté un paso muy importante. ¡Olvidé por completo pedirte oficialmente que fueras mi novia! Pero está bien, porque hacer esto ahora es la mejor manera de empezar nuestro siguiente capítulo.

Te amo muchísimo, bebé. ❤️`,
                sig: "Tuyo para siempre ❤️"
            },
            ar: {
                title: "إلى جاري",
                body: `جهاري،

أتذكر ليلة عندما كنت أشعر بالوحدة الشديدة، وقمت بتنزيل ذلك التطبيق—تطبيقات التعارف للاعبين. والتقيت بفتاة جميلة تحمل اسم المستخدم tapstrafeintomydms. أعلم أنه اسم مجنون!

أتذكر مزاحك وسؤالك عن عدد الكعكات الدائرية (Donuts) التي يمكن وضعها، وكانت إجابتي "اثنتان على أصبعي". لا أعرف حقًا ما الذي جعلك تجيبينني في تلك الليلة؛ أنا متأكد من أنه كان لديك الكثير من المعجبين في رسائلك الخاصة لكونك جميلة جدًا. لكنني سعيد جدًا لأنك فعلت ذلك، لأن تلك كانت البداية الحقيقية لقصتنا... قصتنا الجميلة التي استمرت 5 سنوات يا حبيبتي.

لقد تحملنا وعانينا الكثير معًا على مر السنين خلال الأوقات الصعبة. ولكن إلى جانب تلك اللحظات، جاءت أوقات مليئة بـ الدفء والفرح. قضينا ليالي لا تحصى دون نوم ونحن نلعب Apex. كان ذلك ما جعلنا نقع في الحب أولاً، ولا يزال يحتل مكانة خاصة في قلبي. ثم وجدنا Fortnite و Call of Duty وغيرها الكثير.

في مكان ما خلال كل ذلك، بدأت أدرك أنكِ أنتِ بيتي. حتى في أحلك أوقاتي، كنتِ أنتِ راحتي وأماني.

أعلم أننا سنتزوج في الأسابيع أو الأشهر القادمة، ولكن قبل أن نفعل ذلك، أدركت أنني تجاوزت خطوة مهمة جدًا. لقد نسيت تمامًا أن أطلب منكِ رسمياً أن تكوني حبيبتي! ولكن لا بأس، لأن طلب ذلك الآن هو أجمل طريقة لبدء فصلنا الجديد.

أحبك كثيراً يا حبيبتي. ❤️`,
                sig: "لكِ للأبد ❤️"
            }
        };

        function dodgeNo() {
            const noBtn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');

            const letterCard = document.getElementById('letter-body');
            const data = translations[lang];

            document.getElementById('letter-title').innerText = data.title;
            
            if (lang === 'ar') {
                letterCard.classList.add('rtl');
                letterCard.innerHTML = data.body + `<div class="signature rtl">${data.sig}</div>`;
            } else {
                letterCard.classList.remove('rtl');
                letterCard.innerHTML = data.body + `<div class="signature">${data.sig}</div>`;
            }
        }

        function acceptProposal() {
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ffb3c1', '#ffffff']
            });

            document.getElementById('proposal-view').style.display = 'none';
            const unlocked = document.getElementById('unlocked-content');
            unlocked.style.display = 'block';
            setTimeout(() => { 
                unlocked.style.opacity = '1'; 
            }, 50);

            // Set default language to English (or switch as preferred)
            setLanguage('en');

            // Play music on click
            const music = document.getElementById('bg-music');
            music.play().then(() => {
                document.getElementById('audio-toggle').innerText = 'Pausar';
            }).catch(e => {
                document.getElementById('audio-toggle').innerText = 'Reproducir';
            });
        }

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('audio-toggle');
            if (music.paused) {
                music.play();
                btn.innerText = 'Pausar';
            } else {
                music.pause();
                btn.innerText = 'Reproducir';
            }
        }
    </script>
</body>
</html>
